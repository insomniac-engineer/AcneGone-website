<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="AcneGone app icon">
  <defs>
    <!-- iOS squircle mask (~22.1% corner radius at 1024) -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="226" ry="226"/>
    </clipPath>

    <!-- Chevron A gradient (bright peak → royal blue tips) — coords in path user space -->
    <linearGradient id="chevronGrad" x1="64" y1="32" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A1F1"/>
      <stop offset="100%" stop-color="#2252D7"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#E6F4FD"/>

    <!-- Chevron A mark — scaled from 128×128 mark, centered in safe zone -->
    <g transform="translate(512 512) scale(6.5) translate(-64 -64)">
      <path
        fill="none"
        stroke="url(#chevronGrad)"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M 24 98 L 64 32 L 104 98"
      />
    </g>
  </g>
</svg>
